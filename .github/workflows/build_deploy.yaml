name: Build
on: 
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ExbVersion: 1.19

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download and unzip ArcGIS Experience Builder
        run: |
          npx arcgis-lib-downloader -p arcgis-experience-builder -v ${{ env.ExbVersion }}
          unzip -q arcgis-experience-builder-${{ env.ExbVersion }}.zip -d arcgis-experience-builder-${{ env.ExbVersion }}

      - name: Copy source code to ArcGIS Experience Builder
        run: |
          mkdir -p arcgis-experience-builder-${{ env.ExbVersion }}/client/your-extensions/widgets/save-session
          cp -r src manifest.json config.json icon.svg arcgis-experience-builder-${{ env.ExbVersion }}/client/your-extensions/widgets/save-session/

      - name: Install dependencies
        run: npm ci
        working-directory: arcgis-experience-builder-${{ env.ExbVersion }}/client

      - name: Build widget
        run: npm run build
        working-directory: arcgis-experience-builder-${{ env.ExbVersion }}/client

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: save-session-widget
          path: arcgis-experience-builder-${{ env.ExbVersion }}/client/dist/widgets/save-session
