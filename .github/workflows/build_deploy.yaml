name: Build
on: 
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      ARCGIS_DOWNLOAD_URL: https://downloads.arcgis.com/dms/rest/download/secured/arcgis-experience-builder-1.19.zip?f=json&folder=software%2FExperienceBuilder%2F1.19

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Download ArcGIS Experience Builder
        run: |
          DOWNLOAD_URL=$(curl -s "${{ env.ARCGIS_DOWNLOAD_URL }}" | python3 -c "import sys,json; print(json.load(sys.stdin)['url'])")
          curl -L -o exb.zip "$DOWNLOAD_URL"

      - name: Unzip ArcGIS Experience Builder
        run: |
          unzip -q exb.zip -d exb

      - name: Copy source code to ArcGIS Experience Builder
        run: |
          mkdir -p exb/client/your-extensions/widgets/save-session
          cp -r src manifest.json config.json icon.svg exb/client/your-extensions/widgets/save-session/

      - name: Install dependencies
        run: npm ci
        working-directory: exb/client

      - name: Build widget
        run: npm run build:prod
        working-directory: exb/client

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: save-session-widget
          path: exb/client/dist/widgets/save-session
